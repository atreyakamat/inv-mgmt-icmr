# Offline / local stack. Runs the same pieces Supabase runs, on your machine:
#
#   db       Postgres (Supabase's image: same roles, auth schema and extensions)
#   auth     Supabase Auth (GoTrue): passwords, invites, TOTP two-factor
#   rest     PostgREST: the Data API the app talks to
#   gateway  nginx on :8000, the single "Supabase URL" (/auth/v1, /rest/v1)
#   mail     Mailpit: catches invite and reset emails, UI on :8025
#   setup    applies supabase/migrations, creates demo accounts, seeds data (runs once)
#   app      the Next.js app on :3000
#
# Usage:  docker compose up --build      then open http://localhost:3000
# Reset:  docker compose down -v         (wipes the database volume)
#
# Every secret below is a throwaway for local use only. Never reuse them.

name: inv-mgmt-offline

services:
  db:
    image: supabase/postgres:17.4.1.074
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: offline-dev-postgres-password
      POSTGRES_DB: postgres
      JWT_SECRET: offline-dev-only-jwt-secret-change-me-0123456789abcdef
      JWT_EXP: 3600
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/99-roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    ports:
      - "54322:5432"   # psql -h localhost -p 54322 -U postgres  (password above)
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 3s
      timeout: 5s
      retries: 40

  auth:
    image: supabase/gotrue:v2.177.0
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:8000/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:offline-dev-postgres-password@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000/**
      GOTRUE_DISABLE_SIGNUP: "true"            # accounts are created by admins only
      GOTRUE_JWT_SECRET: offline-dev-only-jwt-secret-change-me-0123456789abcdef
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_USER: offline
      GOTRUE_SMTP_PASS: offline
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@inventory.local
      GOTRUE_SMTP_SENDER_NAME: Store register
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 1000
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: 10
      GOTRUE_PASSWORD_MIN_LENGTH: 12
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/health"]
      interval: 3s
      timeout: 5s
      retries: 40

  rest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:offline-dev-postgres-password@db:5432/postgres
      PGRST_DB_SCHEMAS: public,inventory        # same as "Exposed schemas" on Supabase
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: offline-dev-only-jwt-secret-change-me-0123456789abcdef
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: offline-dev-only-jwt-secret-change-me-0123456789abcdef
      PGRST_APP_SETTINGS_JWT_EXP: 3600

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [auth, rest]
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:8000"

  mail:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "8025:8025"   # inbox UI: http://localhost:8025

  setup:
    build: ./docker/setup
    depends_on:
      db: { condition: service_healthy }
      auth: { condition: service_healthy }
      rest: { condition: service_started }
    environment:
      DATABASE_URL: postgres://postgres:offline-dev-postgres-password@db:5432/postgres
      # Superuser, used only to re-date seed history (bypasses append-only guards once).
      ADMIN_DATABASE_URL: postgres://supabase_admin:offline-dev-postgres-password@db:5432/postgres
      SUPABASE_URL: http://gateway:8000
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1vZmZsaW5lIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MjgwMDAwMCwiZXhwIjoyMTA4MDAwMDAwfQ.872x2RflJPoMxMaVUMcdcCJIDhcQ25LGOJiboF_ee-8
      DEMO_PASSWORD: Inventory-Demo-2026
      # One authenticator key shared by all demo accounts. Remove to make each
      # demo account enrol its own on first sign-in.
      DEMO_TOTP_SECRET: STOREREGISTERDEMOAUTHENTICATOR22
    volumes:
      - ./supabase/migrations:/migrations:ro
    restart: "no"

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        # Baked into the browser bundle: the address your browser uses.
        NEXT_PUBLIC_SUPABASE_URL: http://localhost:8000
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1vZmZsaW5lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4MDAwMDAsImV4cCI6MjEwODAwMDAwMH0.NDiUS01C9axbockzT8bUf0XUytW4848W_bVKQJynhxc
        NEXT_PUBLIC_DEMO_MODE: "true"    # sign-in page lists the demo accounts
    restart: unless-stopped
    depends_on:
      setup: { condition: service_completed_successfully }
    environment:
      SUPABASE_INTERNAL_URL: http://gateway:8000   # the address the app server uses inside Docker
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1vZmZsaW5lIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MjgwMDAwMCwiZXhwIjoyMTA4MDAwMDAwfQ.872x2RflJPoMxMaVUMcdcCJIDhcQ25LGOJiboF_ee-8
      APP_URL: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  db-data:
