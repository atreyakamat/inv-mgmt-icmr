# One address for everything, like a Supabase project URL.
#   /auth/v1/*  -> GoTrue
#   /rest/v1/*  -> PostgREST
# CORS is answered here (Supabase's Kong does the same), so the browser on
# :3000 can call :8000.

map $http_origin $cors_origin {
  default "";
  "http://localhost:3000" $http_origin;
  "http://127.0.0.1:3000" $http_origin;
}

server {
  listen 8000;
  client_max_body_size 5m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Drop upstream CORS headers so they are not duplicated.
  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  proxy_hide_header Access-Control-Allow-Headers;
  proxy_hide_header Access-Control-Allow-Methods;
  proxy_hide_header Access-Control-Expose-Headers;

  add_header Access-Control-Allow-Origin $cors_origin always;
  add_header Access-Control-Allow-Credentials "true" always;
  add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version, accept-profile, content-profile, prefer, range" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  add_header Access-Control-Expose-Headers "content-range, x-supabase-api-version" always;

  if ($request_method = OPTIONS) {
    return 204;
  }

  location /auth/v1/ {
    proxy_pass http://auth:9999/;
  }

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
  }

  location = /health {
    return 200 "ok\n";
  }
}
